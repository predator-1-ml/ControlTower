[project]
name = "control-tower-backend"
version = "0.1.0"
description = "AI Operations Control Tower — LangGraph orchestration backend"
# 3.12, not 3.13: some LangGraph/psycopg extras still lag on 3.13 wheels and a
# mid-build wheel hunt is not how this week should be spent.
requires-python = ">=3.12,<3.13"

dependencies = [
    # ---------------------------------------------------------- orchestration
    # LangGraph 1.x differs substantially from 0.x.  Most tutorials are stale:
    #   config_schema -> context_schema
    #   checkpoint_during -> durability
    #   add_conditional_edges no longer takes then=
    #   create_react_agent -> create_agent
    "langgraph==1.2.11",
    # SECURITY FLOOR, not a preference: <4.2.0 carries CVE-2026-48775.
    # The trap: langgraph-checkpoint-postgres only requires >=4.1.0, which
    # resolves to a vulnerable version.  Pin the floor explicitly.
    "langgraph-checkpoint>=4.2.0,<5",
    # <3.1.1 carries CVE-2026-71433 (store namespace prefix crosses segments).
    "langgraph-checkpoint-postgres==3.1.2",
    "langchain==1.4.1",
    "langchain-core>=1.6.3,<2",

    # ---------------------------------------------------------- LLM providers
    # Two providers behind one interface — see ADR-004.
    "langchain-anthropic>=1.0",          # local dev: native async
    "langchain-aws==1.7.8",              # production: Bedrock
    # Required to READ credentials minted by `aws login` (the OAuth/login
    # credential provider). Without it botocore raises
    # "Missing Dependency: Using the login credential provider requires an
    # additional dependency", which looks like a Bedrock problem but is an auth
    # one. The AWS CLI bundles its own copy; a venv does not.
    "botocore[crt]>=1.43",

    # ---------------------------------------------------------- web / data
    "fastapi>=0.118",
    "uvicorn[standard]>=0.37",
    "sse-starlette>=3.0",
    "pydantic>=2.11",
    "pydantic-settings>=2.7",
    # One database library, one pool. The checkpointer needs psycopg, so domain
    # queries use it too rather than adding a second pool via SQLAlchemy.
    # Migrations are numbered .sql files applied by app/scripts/migrate.py.
    "psycopg[binary,pool]>=3.2.0",
    "pgvector>=0.3.6",   # registers the vector type with psycopg
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    # Runs the FastAPI lifespan in tests, so API tests exercise the real
    # pool/graph/checkpointer wiring rather than a hand-assembled substitute.
    "asgi-lifespan>=2.1",
    "ruff>=0.9",
    "mypy>=1.14",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
