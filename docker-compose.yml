name: control-tower

services:
  postgres:
    # pgvector/pgvector ships the extension prebuilt.  pg17 matches the RDS
    # major version target (PostgreSQL 17.11+ — see ADR-005).
    #
    # DRIFT TO KNOW ABOUT: this tag tracks upstream pgvector (0.8.6 at time of
    # writing) while RDS currently caps at 0.8.2.  Harmless today — HNSW and
    # hnsw.iterative_scan exist in both — but do not reach for a feature that
    # landed after 0.8.2 without checking it is available on RDS first, or it
    # will work locally and fail only after deploy.
    image: pgvector/pgvector:pg17
    # Restart on failure, but stay down if you explicitly `docker compose stop`.
    # `always` would fight you every time you try to stop a service by hand.
    restart: unless-stopped
    environment:
      POSTGRES_USER: control_tower
      POSTGRES_PASSWORD: control_tower
      POSTGRES_DB: control_tower
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U control_tower -d control_tower"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # The backend hard-fails at startup if Postgres is unreachable (see
    # app/main.py). depends_on handles the FIRST start, but not the case where
    # Postgres restarts later and takes the backend down with it — this does.
    restart: unless-stopped
    # backend/.env is the single source of truth for local provider choice and
    # secrets. It is gitignored, and putting keys there keeps them off the
    # command line and out of shell history.
    #
    # ORDERING MATTERS: compose `environment:` OVERRIDES `env_file`. So anything
    # a developer sets in .env must NOT also appear below — a passthrough like
    # `GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}` sets the variable to an EMPTY STRING
    # when it is unset in the shell, which silently beats the real value in .env
    # and produces a "key is unset" error while the key is plainly sitting there.
    env_file:
      - path: ./backend/.env
        required: false

    environment:
      # Only values that MUST differ inside the compose network. Inside it the
      # database host is the service name, not localhost.
      DATABASE_URL: postgresql://control_tower:control_tower@postgres:5432/control_tower
      APP_ENV: local
      # Read from the shell so `AWS_PROFILE=x docker compose up` works; harmless
      # when empty because the AWS SDK falls back to the default profile.
      AWS_PROFILE: ${AWS_PROFILE:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      # Host AWS credentials. Local dev only — on ECS the task role supplies
      # credentials and there is no file to mount.
      #
      # NOT `:ro`, and that is load-bearing. The `aws login` credential provider
      # refreshes its token mid-request and writes the new one to
      # ~/.aws/login/cache. Read-only surfaces as
      #   [Errno 30] Read-only file system: '/home/appuser/.aws/login/cache/tmp...'
      # from inside a graph node — it reads like a Bedrock failure, not a mount
      # one, and only appears once the first token expires, so it passes every
      # test you run in the first hour.
      - ${USERPROFILE:-${HOME}}/.aws:/home/appuser/.aws
    # --reload for local iteration only; the image CMD is the production entrypoint.
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      --timeout-keep-alive 305
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    restart: unless-stopped
    environment:
      # Server-side only — the BFF route handler reads this at request time.
      BACKEND_INTERNAL_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  pgdata:
