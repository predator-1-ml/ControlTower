name: backend-ci

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]

# Only the newest run per branch matters for CI; cancel superseded ones.
# NOTE the contrast with terraform.yml, where cancel-in-progress is false —
# cancelling an apply mid-flight can corrupt state.
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    # A real Postgres with pgvector, not a mock. The integration tests assert
    # against actual SQL behaviour — vector search, the HNSW index, the
    # checkpointer's own tables — none of which a fake would exercise.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: control_tower
          POSTGRES_PASSWORD: control_tower
          POSTGRES_DB: control_tower
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U control_tower"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://control_tower:control_tower@localhost:5432/control_tower
      CONTROL_TOWER_DB_TESTS: "1"

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # 3.12, not 3.13: some LangGraph/psycopg extras still lag on 3.13 wheels.
      - name: Install
        working-directory: backend
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"

      - name: Lint
        working-directory: backend
        run: uv run ruff check app tests

      - name: Migrate
        working-directory: backend
        run: uv run python -m app.scripts.migrate

      - name: Seed
        run: |
          docker exec $(docker ps -q --filter ancestor=pgvector/pgvector:pg17) \
            psql -U control_tower -d control_tower -v ON_ERROR_STOP=1 \
            < data/seed/seed.sql

      - name: Test
        working-directory: backend
        run: uv run pytest tests/ -q
